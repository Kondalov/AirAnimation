    padding:8px 18px; border-radius:12px; font-family:Segoe UI, sans-serif;
    font-size:13px; font-weight:600;
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter:blur(12px);

    display:flex; align-items:center; gap:8px;

  #city-popup {
    position: absolute;

    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(15, 23, 42, 0.45); /* More transparent */

    border-radius: 12px;

    font-size: 18px; /* Smaller font */

    letter-spacing: 1.5px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);

    transition: opacity 0.5s ease-out, transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);

    background:#0b0e14; z-index:100; flex-direction:column; gap:16px;

    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;

<script>
// ═══════════════════════════════════════════════════════════════
//  MAP CONFIGURATION & PROFESSIONAL VECTOR STYLES
// ═══════════════════════════════════════════════════════════════
const DARK_STYLE = 'https://tiles.openfreemap.org/styles/dark';
const LIGHT_STYLE = 'https://tiles.openfreemap.org/styles/positron';
const BRIGHT_STYLE = 'https://tiles.openfreemap.org/styles/bright';

// ── SATELLITE STYLE (Strictly Preserved ESRI World Imagery) ──
const SATELLITE_STYLE = {

};

// ── CARTOON / TRAVELBOAST STYLE (Vibrant Travel Aesthetics) ──
const CARTOON_STYLE = {

  glyphs: 'https://basemaps.cartocdn.com/fonts/{fontstack}/{range}.pbf',

  },
  layers: [
    { id: 'bg', type: 'background', paint: { 'background-color': '#38bdf8' } },
    { id: 'tiles', type: 'raster', source: 'osm', 
      paint: { 
        'raster-opacity': 0.95, 
        'raster-saturation': 0.85,
        'raster-contrast': 0.35,
        'raster-brightness-min': 0.05
      } 
    }
  ]
};

const STYLES = {
  satellite: SATELLITE_STYLE,
  liberty: LIBERTY_STYLE,
  bright: BRIGHT_STYLE,
  streets: BRIGHT_STYLE,
  dark: DARK_STYLE,
  light: LIGHT_STYLE,
  positron: LIGHT_STYLE,
  outdoors: LIBERTY_STYLE,
  cartoon: CARTOON_STYLE
};

// MapLibre instance initialized with Satellite by default
const map = new maplibregl.Map({
  container: 'map',
  style: SATELLITE_STYLE,
  center: [37.62, 55.75],
  zoom: 5,
  pitch: 45,
  bearing: 0,
  attributionControl: false,
  antialias: true,
  maxPitch: 85,
  projection: { type: 'globe' }
});

map.addControl(new maplibregl.NavigationControl({ showCompass: true, visualizePitch: true }), 'top-right');
map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');

// ═══════════════════════════════════════════════════════════════// ═══════════════════════════════════════════════════════════════
//  ERROR INTERCEPTOR FOR DEBUGGING
// ═══════════════════════════════════════════════════════════════
function sendErrorToCSharp(msg) {
    try {
        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage(JSON.stringify({ type: 'js_error', message: String(msg) }));
        }
    } catch(e) {}
}

window.onerror = function(msg, url, line, col, error) {
    sendErrorToCSharp(`Global Error: ${msg} at ${url}:${line}:${col}`);
    return false;
};
window.addEventListener('unhandledrejection', function(event) {
    sendErrorToCSharp(`Promise Rejection: ${event.reason}`);
});
const origError = console.error;
console.error = function(...args) {
    sendErrorToCSharp(`Console Error: ${args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ')}`);
    origError.apply(console, args);
};
const origWarn = console.warn;
console.warn = function(...args) {
    sendErrorToCSharp(`Console Warn: ${args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ')}`);
    origWarn.apply(console, args);
};

// ═══════════════════════════════════════════════════════════════
//  GLOBE MASKING FOR WEATHER
// ═══════════════════════════════════════════════════════════════
function updateWeatherMask() {
  const container = document.getElementById('weather-container');
  if (!container || !map) return;
  
  const zoom = map.getZoom();
  // MapLibre globe radius in pixels
  const R = (512 * Math.pow(2, zoom)) / (2 * Math.PI);
  
  const w = map.getContainer().offsetWidth;
  const h = map.getContainer().offsetHeight;
  const maxR = Math.sqrt(w*w + h*h) / 2;
  
  if (R > maxR * 1.5) {
     container.style.clipPath = 'none';
     container.style.webkitClipPath = 'none';
  } else {
     // A slight feathering or just exact radius (subtracting 2 pixels to avoid white/black edge artifacts)
     container.style.clipPath = `circle(${Math.max(0, R - 1)}px at 50% 50%)`;
     container.style.webkitClipPath = `circle(${Math.max(0, R - 1)}px at 50% 50%)`;
  }
}
// ═══════════════════════════════════════════════════════════════
//  MATH & GEOMETRY HELPERS
// ═══════════════════════════════════════════════════════════════
function calcBearing(lat1, lon1, lat2, lon2) {
  const φ1 = lat1 * Math.PI / 180;
  const φ2 = lat2 * Math.PI / 180;
  const Δλ = (lon2 - lon1) * Math.PI / 180;
  const y = Math.sin(Δλ) * Math.cos(φ2);
  const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

function calcTotalDist(coords) {
  if (!coords || coords.length < 2) return 0;
  let d = 0;
  for (let i = 1; i < coords.length; i++) {
    if (window.turf && window.turf.distance) {
      d += turf.distance(turf.point(coords[i-1]), turf.point(coords[i]), { units: 'meters' });
    } else {
      const lat1 = coords[i-1][1], lon1 = coords[i-1][0];
      const lat2 = coords[i][1], lon2 = coords[i][0];
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      d += 6371000 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
  }
  return d;
}

// ═══════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════
const ANIM_DURATION_BASE = 15; // Base duration in seconds

const state = {
  waypoints: [],           // [{id, lat, lon, label, marker}]
  routeCoords: [],         // [[lon, lat], ...]
  transportSvg: '',
  transportSize: 84,       // size in px
  transportMarker: null,
  
  // Coordinates & Motion
  currentLon: 37.62,
  currentLat: 55.75,
  currentHeading: 0,
  currentBankRoll: 0,      // Aircraft roll/bank angle on turns
  
  // Flight Orientation Settings (User Selectable)
  orientationMode: 'forward', // 'forward' (0°), 'isometric' (45°), 'side' (90°), 'custom'
  modelAngleOffset: 0,        // degrees (-180..+180)
  flightAltitude: 2500,       // meters above ground (300..10000)
  enableBanking: true,
  
  // Features
  showCityPopups: false,
  shownCityPopups: new Set(),
  
  // Animation
  animFrame: null,
  animProgress: 0,
  animPlaying: false,
  animSpeed: 1,            // Multiplier (up to 500x)
  
  // Route Drawing Settings (TravelBoast Trailing vs Full Route)
  routeDrawMode: 'trailOnly', // 'trailOnly' (Строится позади транспорта) | 'fullRoute' (Полный маршрут)
  trailStyle: 'redDashed',    // 'redDashed' | 'whiteDashed' | 'neon' | 'solid'
  
  // Unity-style Camera Controls
  cameraMode: 'follow',       // 'follow' | 'overview' | 'isometric'
  cameraFollow: true,
  cameraPitch: 50,
  cameraZoom: 7.5,
  cameraBearingOffset: 0,
  cameraDamping: 0.12,
  
  totalDist: 0,
};

let tempMarker = null;

// ═══════════════════════════════════════════════════════════════
//  3D VEHICLE FACTORY & MODERN THREE.JS ENGINE
// ═══════════════════════════════════════════════════════════════

function extractMapMatrix(matrixOrArgs) {
    if (!matrixOrArgs) return null;
    if (ArrayBuffer.isView(matrixOrArgs) || Array.isArray(matrixOrArgs)) {
        return matrixOrArgs;
    }
    if (matrixOrArgs.defaultProjectionData && matrixOrArgs.defaultProjectionData.mainMatrix) {
        return matrixOrArgs.defaultProjectionData.mainMatrix;
    }
    if (matrixOrArgs.mainMatrix) {
        return matrixOrArgs.mainMatrix;
    }
    return null;
}

function buildProceduralVehicle(id) {
    if (!window.THREE) return null;
    const THREE = window.THREE;
    const root = new THREE.Group();
    root.name = 'ProceduralVehicle_' + (id || 'default');

    // Premium PBR Materials
    const pbrMat = (color, metal = 0.5, rough = 0.25, emissive = 0x000000) => 
        new THREE.MeshStandardMaterial({ 
            color, metalness: metal, roughness: rough, emissive, side: THREE.DoubleSide 
        });
    const glossPaint = (color) => 
        new THREE.MeshStandardMaterial({ 
            color, metalness: 0.7, roughness: 0.18, side: THREE.DoubleSide 
        });
    const glassMat = (color = 0x60a5fa, opacity = 0.65) => 
        new THREE.MeshPhysicalMaterial({
            color, transparent: true, opacity, roughness: 0.05, metalness: 0.15, transmission: 0.0, side: THREE.DoubleSide
        });
    const chromeMat = pbrMat(0xf8fafc, 0.95, 0.08);
    const darkTrimMat = pbrMat(0x0f172a, 0.35, 0.55);
    const tireMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.9, metalness: 0.05 });
    const rimMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.2, metalness: 0.85 });
    const caliperMat = pbrMat(0xdc2626, 0.6, 0.2); // Red Brembo caliper
    const ledWhite = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const ledRed = new THREE.MeshBasicMaterial({ color: 0xff1e27 });
    const ledGreen = new THREE.MeshBasicMaterial({ color: 0x10b981 });
    const ledCyan = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
    const flameMat = new THREE.MeshBasicMaterial({ color: 0xff6600 });
    const flameCoreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const goldFoilMat = pbrMat(0xfbbf24, 0.9, 0.2);
    const solarCellMat = pbrMat(0x1e3a8a, 0.8, 0.15);
    const teakWoodMat = pbrMat(0xb45309, 0.1, 0.7);

    function addWheel(parent, x, y, z, r = 0.18, w = 0.12, rimColor = 0xe2e8f0) {
        const wheelGroup = new THREE.Group();
        wheelGroup.position.set(x, y, z);

        // Rubber Tire
        const tireGeom = new THREE.CylinderGeometry(r, r, w, 20);
        tireGeom.rotateZ(Math.PI / 2);
        const tire = new THREE.Mesh(tireGeom, tireMat);
        wheelGroup.add(tire);

        // Alloy Rim with Lip
        const rimGeom = new THREE.CylinderGeometry(r * 0.68, r * 0.68, w * 1.02, 16);
        rimGeom.rotateZ(Math.PI / 2);
        const rim = new THREE.Mesh(rimGeom, pbrMat(rimColor, 0.85, 0.15));
        wheelGroup.add(rim);

        // 5-Spoke Rim Pattern
        const spokeGeom = new THREE.BoxGeometry(w * 1.04, r * 1.2, r * 0.12);
        for (let i = 0; i < 3; i++) {
            const spoke = new THREE.Mesh(spokeGeom, pbrMat(rimColor, 0.85, 0.15));
            spoke.rotation.x = (i * Math.PI) / 3;
            wheelGroup.add(spoke);
        }

        // Brake Caliper
        const caliper = new THREE.Mesh(new THREE.BoxGeometry(w * 0.9, r * 0.35, r * 0.2), caliperMat);
        caliper.position.set(x > 0 ? -w * 0.1 : w * 0.1, r * 0.3, 0);
        wheelGroup.add(caliper);

        parent.add(wheelGroup);
        return wheelGroup;
    }

    const type = (id || '').toLowerCase();
    const animUpdaters = [];

    // ═══════════════════════════════════════════════════════════════
    // 1. CARS (Sedans / Coupes / Supercars / EVs)
    // ═══════════════════════════════════════════════════════════════
    if (type.includes('tesla_s') || type.includes('taycan') || type.includes('lucid') || 
        type.includes('ioniq') || type.includes('audi_etron') || type.includes('corvette') || 
        type.includes('zeekr') || type.includes('prius') || type.includes('cooper') || 
        type.includes('polestar')) {
        
        let color = 0x2563eb;
        if (type.includes('taycan')) color = 0xd61a3c;
        else if (type.includes('tesla_s')) color = 0xf8fafc;
        else if (type.includes('lucid')) color = 0x1e293b;
        else if (type.includes('ioniq')) color = 0x94a3b8;
        else if (type.includes('corvette')) color = 0xdc2626;
        else if (type.includes('zeekr')) color = 0x0284c7;
        else if (type.includes('prius')) color = 0xef4444;
        else if (type.includes('cooper')) color = 0x15803d;

        const body = new THREE.Group();
        const carPaint = glossPaint(color);

        // Lower Aerodynamic Chassis / Side Skirts
        const lowerBody = new THREE.Mesh(new THREE.BoxGeometry(0.88, 0.22, 1.85), carPaint);
        lowerBody.position.set(0, 0.20, 0);
        const frontBumper = new THREE.Mesh(new THREE.CylinderGeometry(0.44, 0.44, 0.22, 16, 1, false, 0, Math.PI), carPaint);
        frontBumper.position.set(0, 0.20, 0.92);
        frontBumper.rotation.y = -Math.PI / 2;
        const rearBumper = new THREE.Mesh(new THREE.BoxGeometry(0.86, 0.20, 0.2), darkTrimMat);
        rearBumper.position.set(0, 0.18, -0.93);
        body.add(lowerBody); body.add(frontBumper); body.add(rearBumper);

        // Curved Greenhouse / Cabin Glass
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(0.74, 0.26, 1.05), glassMat(0x1e293b, 0.85));
        cabin.position.set(0, 0.42, -0.05);
        const roof = new THREE.Mesh(new THREE.BoxGeometry(0.70, 0.03, 0.85), carPaint);
        roof.position.set(0, 0.55, -0.08);
        body.add(cabin); body.add(roof);

        // Aerodynamic Side Mirrors
        const mirrorL = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.05, 0.06), carPaint);
        mirrorL.position.set(-0.45, 0.38, 0.25);
        const mirrorR = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.05, 0.06), carPaint);
        mirrorR.position.set(0.45, 0.38, 0.25);
        body.add(mirrorL); body.add(mirrorR);

        // Full-Width LED DRL Front Lightbar + Projector Headlights
